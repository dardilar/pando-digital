  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  /* La animación ocupa el 100% de su contenedor. Ajusta .pd-stage abajo. */
  .pd-stage { position: relative; width: 100%; height: 520px; }
  @keyframes pdMarquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @keyframes pdFloat  { 0% { transform: translateY(0); } 50% { transform: translateY(-16px); } 100% { transform: translateY(0); } }
  @keyframes pdFloatB { 0% { transform: translateY(0); } 50% { transform: translateY(14px);  } 100% { transform: translateY(0); } }
  /* Respeta usuarios que prefieren menos movimiento */
  @media (prefers-reduced-motion: reduce) {
    #pdTrack, #pdTrack * { animation: none !important; }
  }
</style>

<script>
  // Duplica el set de tarjetas para que el bucle sea continuo (sin saltos).
  (function () {
    var track = document.getElementById('pdTrack');
    if (!track) return;
    var set = document.getElementById('pdSet');
    if (set && track.children.length < 2) {
      var clone = set.cloneNode(true);
      clone.removeAttribute('id');
      track.appendChild(clone);
    }
    // Opcional: cambia la velocidad (segundos) o el sentido.
    // track.style.animationDuration = '42s';
    // track.style.animationDirection = 'reverse';
  })();
</script>
